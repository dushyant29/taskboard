name: ci-cd
on:
  push: {branches: [main]}
  pull_request:
env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r backend/requirements-dev.txt && cd backend && pytest -q
      - uses: azure/setup-helm@v4
      - run: helm lint helm/taskboard && helm template t helm/taskboard -f helm/taskboard/values-prod.yaml --set externalDatabaseUrl=x > /dev/null

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      matrix: {svc: [backend, frontend]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.svc }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/taskboard-${{ matrix.svc }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/taskboard-${{ matrix.svc }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - run: docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/taskboard-${{ matrix.svc }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production        # add required reviewers in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $HOME/kubeconfig
      - run: |
          export KUBECONFIG=$HOME/kubeconfig
          helm upgrade --install taskboard helm/taskboard -n taskboard --create-namespace \
            -f helm/taskboard/values-prod.yaml \
            --set backend.image.repository=${{ env.REGISTRY }}/${{ env.OWNER }}/taskboard-backend \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.OWNER }}/taskboard-frontend \
            --set backend.image.tag=${{ github.sha }} --set frontend.image.tag=${{ github.sha }} \
            --set externalDatabaseUrl='${{ secrets.DATABASE_URL }}' \
            --atomic --timeout 5m
