{{- if .Values.monitoring.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: {{ .Release.Name }}-backend}
spec:
  selector: {matchLabels: {app: backend}}
  endpoints: [{port: http, path: /metrics, interval: 15s}]
{{- end }}
{{- if .Values.monitoring.alerts }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: {{ .Release.Name }}-alerts}
spec:
  groups:
    - name: taskboard
      rules:
        - alert: HighErrorRate
          expr: sum(rate(http_requests_total{status="5xx"}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
          for: 5m
          labels: {severity: critical}
          annotations: {summary: "Backend 5xx rate above 5%"}
        - alert: HighLatencyP95
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
          for: 10m
          labels: {severity: warning}
{{- end }}
