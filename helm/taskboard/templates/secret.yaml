apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env
  labels: {{- include "tb.labels" . | nindent 4 }}
stringData:
  DATABASE_URL: {{ include "tb.dburl" . | quote }}
  REDIS_URL: "redis://{{ .Release.Name }}-redis:6379/0"
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
