apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels: {{- include "tb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: {matchLabels: {app: frontend, release: {{ .Release.Name }}}}
  template:
    metadata:
      labels: {app: frontend, release: {{ .Release.Name }}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env: [{name: BACKEND_URL, value: "http://{{ .Release.Name }}-backend:8000"}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-frontend}
spec:
  selector: {app: frontend, release: {{ .Release.Name }}}
  ports: [{name: http, port: 80, targetPort: http}]
