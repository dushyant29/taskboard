<!doctype html>
<html><head><meta charset="utf-8"><title>Taskboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;max-width:520px;margin:3rem auto;padding:0 1rem}
li{display:flex;gap:.5rem;align-items:center;padding:.4rem 0;border-bottom:1px solid #8884}
li.done span{text-decoration:line-through;opacity:.6} span{flex:1;cursor:pointer}
input{flex:1;padding:.5rem} form{display:flex;gap:.5rem} ul{list-style:none;padding:0}
</style></head><body>
<h1>Taskboard</h1>
<form id="f"><input id="t" placeholder="New task" required><button>Add</button></form>
<ul id="l"></ul>
<script>
const api = (p, o) => fetch('/api/tasks' + p, o).then(r => r.status === 204 ? null : r.json());
const render = async () => {
  const tasks = await api('');
  l.innerHTML = '';
  tasks.forEach(t => {
    const li = document.createElement('li'); li.className = t.done ? 'done' : '';
    const s = document.createElement('span'); s.textContent = t.title;
    s.onclick = async () => { await api('/' + t.id, {method: 'PATCH'}); render(); };
    const b = document.createElement('button'); b.textContent = 'x';
    b.onclick = async () => { await api('/' + t.id, {method: 'DELETE'}); render(); };
    li.append(s, b); l.append(li);
  });
};
f.onsubmit = async e => {
  e.preventDefault();
  await api('', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title: t.value})});
  t.value = ''; render();
};
render();
</script></body></html>
